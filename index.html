<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bannerfall</title>
<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║ BANNERFALL — single-file AAA tower defense. See GAME_SPEC.md.     ║
     ║ Sections are owned by builder agents; edit only your section and  ║
     ║ marked HOOK points. The shot harness (SECTION: MAIN) is sacred.   ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<link rel="stylesheet" href="css/main.css?v=__BUILD__">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0f14">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script type="importmap">
{"imports":{"three":"./js/vendor/three.module.js","three/addons/":"./js/vendor/addons/"}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<!-- ══ SECTION: UI-HTML ══ (owner: UI builder). All ornament is inline SVG — no external
     files, nothing fetched, and nothing that has to decode before the first shot render. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3cf"/><stop offset=".42" stop-color="#e8b64c"/>
    <stop offset=".72" stop-color="#a9761d"/><stop offset="1" stop-color="#f2d493"/></linearGradient>
  <linearGradient id="gGoldR" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffeab4"/><stop offset=".5" stop-color="#daa338"/><stop offset="1" stop-color="#8a5f16"/></linearGradient>
  <linearGradient id="gBlue" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#3f74bd"/><stop offset=".55" stop-color="#2b5697"/><stop offset="1" stop-color="#15305e"/></linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2f6fb"/><stop offset=".5" stop-color="#a9b6c6"/><stop offset="1" stop-color="#5f6b7a"/></linearGradient>
  <!-- half laurel wreath: mirrored to ring the crest -->
  <g id="laurel">
    <path d="M52 132C26 124 10 100 9 72 8 48 18 26 34 12" fill="none" stroke="#8a5f16" stroke-width="3" stroke-linecap="round"/>
    <g fill="url(#gGoldR)" stroke="#7a5312" stroke-width=".5">
      <ellipse cx="27" cy="19" rx="12" ry="5" transform="rotate(-48 27 19)"/>
      <ellipse cx="18" cy="33" rx="12.5" ry="5.2" transform="rotate(-32 18 33)"/>
      <ellipse cx="12" cy="49" rx="12.5" ry="5.2" transform="rotate(-16 12 49)"/>
      <ellipse cx="10" cy="66" rx="12" ry="5.1" transform="rotate(-2 10 66)"/>
      <ellipse cx="13" cy="83" rx="11.6" ry="5" transform="rotate(15 13 83)"/>
      <ellipse cx="21" cy="99" rx="11" ry="4.8" transform="rotate(32 21 99)"/>
      <ellipse cx="33" cy="113" rx="10.2" ry="4.5" transform="rotate(48 33 113)"/>
      <ellipse cx="48" cy="124" rx="9" ry="4.1" transform="rotate(63 48 124)"/>
    </g>
    <g fill="url(#gGoldR)" opacity=".68">
      <ellipse cx="39" cy="24" rx="9" ry="4" transform="rotate(20 39 24)"/>
      <ellipse cx="29" cy="40" rx="9.4" ry="4.1" transform="rotate(34 29 40)"/>
      <ellipse cx="24" cy="57" rx="9.4" ry="4.1" transform="rotate(52 24 57)"/>
      <ellipse cx="24" cy="75" rx="9" ry="4" transform="rotate(70 24 75)"/>
      <ellipse cx="30" cy="92" rx="8.4" ry="3.8" transform="rotate(86 30 92)"/>
      <ellipse cx="41" cy="106" rx="7.8" ry="3.6" transform="rotate(104 41 106)"/>
    </g>
  </g>
  <!-- gold scroll flourish for the wordmark rules -->
  <g id="flour" stroke-linecap="round">
    <path d="M2 9h74" stroke="url(#gGoldR)" stroke-width="1.5"/>
    <path d="M2 12.4h56" stroke="url(#gGoldR)" stroke-width=".9" opacity=".5"/>
    <path d="M76 9c9 0 12-6.4 19-6.4s10 5 17 5" fill="none" stroke="url(#gGoldR)" stroke-width="1.9"/>
    <path d="M76 9c9 0 12 6.4 19 6.4s10-5 17-5" fill="none" stroke="url(#gGoldR)" stroke-width="1.9"/>
    <path d="M112 9l9-5v10z" fill="url(#gGoldR)"/>
    <circle cx="76" cy="9" r="2.8" fill="#ffe7ab"/>
    <circle cx="95" cy="9" r="1.7" fill="url(#gGoldR)"/>
  </g>
</defs></svg>

<div id="ui">
  <div id="hud">
    <div id="hudL">
      <div class="chip iron frm" id="chipGold"><i class="ic ic-gold"></i><div><span class="lbl" data-l="hud.gold">Gold</span><span class="val" id="gold">0</span></div></div>
      <div class="chip iron frm" id="chipLives"><i class="ic ic-vale"></i><div><span class="lbl" data-l="hud.vale">Vale</span><span class="val" id="lives">0</span></div></div>
      <div class="chip iron frm" id="chipWave"><i class="ic ic-sw"></i><div><span class="lbl" data-l="hud.wave">Wave</span><span class="val" id="wave">0/10</span></div></div>
      <div class="chip iron frm" id="chipMuster"><i class="ic ic-must"></i><div><span class="lbl" data-l="hud.muster">Muster</span><span class="val" id="muster">0/6</span></div></div>
    </div>
    <div id="hudRight">
      <button id="btnSpeed" class="ibtn frm" data-lt="hud.speed" title="Speed">×1</button>
      <button id="btnPause" class="ibtn frm gl gl-pause" data-lt="hud.pause" title="Pause (Space)"></button>
      <button id="btnGear" class="ibtn frm gl gl-gear" data-lt="hud.settings" title="Settings"></button>
    </div>
  </div>
  <!-- SPEC3 §D: the omen offer stands ABOVE the scout's dispatch, so the two share one rail -->
  <div id="leftRail">
    <div id="omenRow" class="hidden"></div>
    <div id="wavePrev" class="parch frm hidden"></div>
  </div>
  <!-- SPEC4 §A/§B: auto-call and the tongue are player preferences, so they live with sound
       and quality. Every label is filled from the string layer at boot (data-l). -->
  <div id="settings" class="iron frm hidden">
    <div class="sT" data-l="set.title">Settings</div>
    <button id="btnMute"><span data-l="set.sound">Sound</span> <b id="muteV">On</b></button>
    <button id="btnQual"><span data-l="set.qual">Quality</span> <b id="qualV">High</b></button>
    <button id="btnAuto" data-lt="set.autoT"><span data-l="set.auto">Auto-call</span> <b id="autoV">Off</b></button>
    <button id="btnLang"><span data-l="set.lang">Language</span> <b id="langV">English</b></button>
    <button id="btnReset" data-l="set.reset">Restart Campaign</button>
  </div>
  <div id="msg"></div>
  <div id="floaters"></div>
  <button id="btnWave" class="frm" data-l="call.start">⚔ Start Wave</button>
  <!-- FIX3-UI §2 — the keybind sheet is FOLDED. It used to be a permanent four-row dump of
       grey caps sitting unframed on green grass in the corner of every gameplay frame. It is
       a single struck-iron disc now; the sheet itself is a framed plate that opens above it
       on hover or click, and it is collapsed by default in every shot preset because nothing
       opens it there. -->
  <div id="hint"><button id="hintT" class="iron" data-lt="hint.legend" aria-expanded="false">?</button><div id="hintL" class="iron frm"><b><span data-l="hint.build">Build</span><kbd>1–7</kbd></b><b><span data-l="hint.place">Place</span><kbd data-l="key.click">Click</kbd></b><b><span data-l="hint.keep">Keep</span><kbd data-l="key.shift">Shift</kbd></b><b><span data-l="hint.cancel">Cancel</span><kbd data-l="key.esc">Esc</kbd></b><b><span data-l="hint.orders">Orders</span><kbd>T</kbd></b><b><span data-l="hint.omen">Omen</span><kbd>8–0</kbd></b><b><span data-l="hint.powers">Powers</span><kbd>Q W</kbd></b><b><span data-l="hint.traps">Traps</span><kbd>Z X C</kbd></b></div></div>
  <div id="placeBar" class="hidden"><div id="placeMsg" class="iron frmB ok"></div>
    <div id="placeBtns"><button id="placeOk" class="iron frm" data-lt="place.raise" title="Raise">✓</button><button id="placeNo" class="iron frm" data-lt="place.cancel" title="Cancel">✗</button></div></div>
  <div id="tutHint" class="parch frm hidden"></div>
  <div id="buildMenu" class="panel iron frmB hidden"></div>
  <div id="towerMenu" class="panel iron frmB hidden"></div>

  <div id="title" class="overlay">
    <svg id="crest" viewBox="-22 -4 164 152" aria-label="Bannerfall crest">
      <use href="#laurel" transform="translate(-18,6) scale(.94)"/>
      <use href="#laurel" transform="translate(138,6) scale(-.94,.94)"/>
      <!-- crown -->
      <path d="M40 17h40l-3.4 9.5H43.4z" fill="url(#gGold)"/>
      <path d="M38.5 17l4-10 6 6 5.5-9.5L60 12l6-8.5 5.5 9.5 6-6 4 10z" fill="url(#gGold)" stroke="#6d4a10" stroke-width=".8"/>
      <circle cx="60" cy="3.5" r="2.6" fill="#ffe7ab"/><circle cx="44.5" cy="8" r="1.9" fill="#ffe7ab"/><circle cx="75.5" cy="8" r="1.9" fill="#ffe7ab"/>
      <!-- shield -->
      <path d="M22 30h76v42c0 26-19 43-38 53C41 115 22 98 22 72z" fill="url(#gBlue)" stroke="url(#gGold)" stroke-width="3.4"/>
      <path d="M22 30h76v6H22z" fill="#0d1c36" opacity=".45"/>
      <path d="M25.5 33.5h69v38.5c0 23.5-17 39.5-34.5 48.5C42.5 111.5 25.5 95.5 25.5 72z" fill="none" stroke="#ffe7ab" stroke-width="1" opacity=".3"/>
      <!-- chevron -->
      <path d="M22 62l38-20 38 20v11L60 53 22 73z" fill="url(#gGold)" opacity=".92"/>
      <!-- falling banner on a staff -->
      <g transform="rotate(-18 60 82)">
        <rect x="58.3" y="46" width="3.4" height="56" rx="1.4" fill="#4a3113"/>
        <path d="M61.7 52h24l-5.5 8.5 5.5 8.5h-24z" fill="#8f2d20" stroke="#6d4a10" stroke-width="1"/>
        <path d="M61.7 52h24l-5.5 8.5 5.5 8.5h-24z" fill="none" stroke="#ffb9a2" stroke-width=".7" opacity=".35"/>
        <circle cx="60" cy="44.5" r="3.3" fill="url(#gGold)"/>
      </g>
      <!-- crossed swords behind the lower shield -->
      <g stroke-linecap="round" opacity=".95">
        <path d="M38 104l17-19" stroke="url(#gSteel)" stroke-width="3.6"/>
        <path d="M82 104L65 85" stroke="url(#gSteel)" stroke-width="3.6"/>
        <path d="M35 99l6.5 6.5M85 99l-6.5 6.5" stroke="url(#gGold)" stroke-width="3"/>
      </g>
    </svg>
    <div id="logoWrap"><h1 id="logo">BANNERFALL</h1></div>
    <div id="tagRow">
      <svg class="flr" viewBox="0 0 124 18"><use href="#flour"/></svg>
      <p id="tagline" data-l="tag">Hold the vale · Break the horde</p>
      <svg class="flr r" viewBox="0 0 124 18"><use href="#flour"/></svg>
    </div>
    <button id="btnPlay" class="bigBtn frm"><span data-l="play">Play</span></button>
    <div id="titleFoot">10 waves &nbsp;·&nbsp; 4 fortifications &nbsp;·&nbsp; one road</div>
  </div>

  <div id="maps" class="overlay hidden">
    <div id="mapsKick" data-l="maps.kick">The campaign</div>
    <h2 id="mapsT" data-l="maps.title">CHOOSE YOUR ROAD</h2>
    <div id="mapsRule" class="rule"></div>
    <!-- SPEC4 §E: the Daily War chip. Built by buildDaily() off the stamp CORE captured at
         boot — the chooser is the last screen before a run starts, so it belongs here. -->
    <div id="dailyRow"></div>
    <div id="mapCards"></div>
    <div id="mapsFoot"><button id="btnBack" class="frm" data-l="maps.back">← Back</button><!--
      SPEC6 §B: the War Council chip. It is the door to the council AND the laurel balance —
      built by laurelChip() so the number is always the derived one, never a cached copy. -->
      <button id="btnCouncil" class="iron frm"></button><!--
      SPEC6 §C: the Deeds chip, in the council chip's idiom — the two are a pair, and both
      are a door AND a read-out. Built by deedChip(). -->
      <button id="btnDeeds" class="iron frm"></button><span id="mapsSeed" class="seedTag"></span></div>
  </div>

  <!-- SPEC6 §B — THE WAR COUNCIL. A parchment writ off the chooser: three branches, three
       tiers, free respec. Nothing here can touch a run in progress; it writes the record and
       SIM copies it into force at the next run start. -->
  <div id="council" class="overlay hidden">
    <div id="cKick" data-l="cn.kick">Between the wars</div>
    <h2 id="cT" data-l="cn.title">THE WAR COUNCIL</h2>
    <div id="cRule" class="rule"></div>
    <div id="cBal"></div>
    <div id="cTree"></div>
    <div id="cHint"></div>
    <div id="cFoot"><button id="btnCBack" class="frm" data-l="cn.back">← Back</button><button id="btnCRespec" class="frm"></button></div>
  </div>

  <!-- SPEC6 §C — THE CHRONICLE OF DEEDS. A parchment grid off the chooser: four registers,
       twenty-eight crests, iron while unwon and gold once taken. Exactly one way in
       (btnDeeds) and one way out (btnDDBack), the same contract #council keeps. -->
  <div id="deeds" class="overlay hidden">
    <div id="ddKick" data-l="dd.kick">The chronicle</div>
    <h2 id="ddT" data-l="dd.title">DEEDS</h2>
    <div id="ddRule" class="rule"></div>
    <div id="ddBal"></div>
    <div id="ddGrid"></div>
    <div id="ddHint"></div>
    <div id="ddFoot"><button id="btnDDBack" class="frm" data-l="dd.back">← Back</button></div>
  </div>

  <div id="end" class="overlay hidden">
    <div id="endPlate" class="iron frmB">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <div class="rule"></div>
      <div id="endStars" class="hidden"></div>
      <div id="endStarL" class="hidden"></div>
      <!-- SPEC6 §B: what this run put in the War Council's purse. Hidden on a run that
           earned nothing, so a replay of a road already three-starred says nothing. -->
      <div id="endLaurel" class="hidden"></div>
      <div id="medals"></div>
      <div id="endStats"></div>
      <button id="btnNext" class="bigBtn frm hidden"></button>
      <!-- SPEC4 §E: the endless call. Filled and wired by UI.showEnd; hidden on a defeat. -->
      <button id="btnHold" class="bigBtn frm hidden"></button>
      <button id="btnRestart" class="bigBtn frm" data-l="end.replay">Play Again</button>
    </div>
  </div>
  <!-- SPEC6 §C — the unlock toast. Positioned and faded by UI.toastFrame off the RENDER
       clock; it carries no CSS transition, so nothing here can mutate after a shot render. -->
  <div id="deedToast" class="iron frm hidden"></div>
  <div id="stats" class="hidden"></div>
</div>
<!-- ══ END SECTION: UI-HTML ══ -->
<script type="module" src="js/game.js?v=__BUILD__"></script>
<script>
// PWA service worker — NEVER in shot mode (a stale cache would poison the deterministic harness).
if ('serviceWorker' in navigator && !new URLSearchParams(location.search).has('shot')
    && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=__BUILD__'));
}
</script>
</body>
</html>
